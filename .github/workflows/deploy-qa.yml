name: Deploy QA

# on:
#   push:
#     branches:
#       - homolog
on:
  pull_request:
    branches:
      - "*"

jobs:
  build_and_deploy:
    name: Build
    runs-on: ubuntu-22.04
    concurrency: ci-${{ github.ref }}
    permissions:
      contents: write

    env:
      isCI: "true"
      BASE_SCHEME: ${{ secrets.BASE_URL_DEBUG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: adopt
          java-version: "17"

      - name: Create local.properties
        run: |
          echo "BASE_URL=${BASE_SCHEME}" >> local.properties
          echo "ciVersionName=Teste" >> local.properties

      - name: Build android
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Firebase App Distribution QA
        uses: hasretsariyer/firebase-app-distribution-github-action@v1
        with:
          app_id: ${{secrets.FIREBASE_APP_ID}}
          firebase_token: ${{secrets.FIREBASE_TOKEN}}
          app_file: app/build/outputs/apk/debug/app-debug.apk
          tester_groups: routinely---qa

      - name: Increment version
        id: increment-version
        uses: RichardInnocent/semantic-versioning-git@v0.0.1
